
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRecruit | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080d1b;
            color: white;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #111a2e;
            border: 1px solid #273452;
            border-radius: 18px;
            box-shadow: 0 20px 60px #0008;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #a78bfa;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9ca9c2;
            margin-bottom: 32px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #d5dced;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #35425e;
            background: #0b1325;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #a78bfa;
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .error {
            padding: 12px;
            margin-bottom: 16px;
            background: #451b2a;
            border: 1px solid #87334a;
            border-radius: 8px;
            color: #ffb4c1;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #71809d;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">SmartRecruit</div>

        <div class="subtitle">
            Recruiter Management Portal
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
                autocomplete="username"
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Sign In</button>

        </form>

        <div class="footer">
            © 2026 SmartRecruit. All rights reserved.
        </div>

    </div>

</body>
</html>
